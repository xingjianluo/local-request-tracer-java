spring.application.name=local-request-tracer
# 本地追踪存储容量上限（写满后 FIFO 顶掉最早记录）
trace.max-traces=1024
# 慢操作阈值（毫秒），超过即归因 SLOW
trace.slow-threshold-ms=500
# 追踪保留时长（毫秒，按 trace 结束时间计）；0 表示关闭按时间过期
trace.retention-ms=3600000
# 后台过期回收扫描间隔（毫秒）；0 表示不启动后台扫描，仅写入/查询时顺带回收
trace.sweep-interval-ms=30000
# 日志带 traceId，便于排查
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSS} %5p [%15.15t] [trace=%X{traceId:-}] %-40.40logger{39} : %m%n
